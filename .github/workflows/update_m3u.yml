name: Update Combined M3U

on:
  schedule:
    # Runs every 12 hours (adjust cron as needed)
    - cron: '0 */12 * * *'
  # Allows you to run it manually from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run M3U merger script
        run: python merge_m3u.py

      - name: Commit and push updated M3U
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add combined.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update combined.m3u" && git push)